name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      # The recovery tests spawn real (small, non-Android) Docker
      # containers to verify restart reattachment — ubuntu-latest runners
      # ship Docker preinstalled and running, so no setup is needed.
      - run: npm test
